function renderJobs(){const jobs=JOBS.filter(j=>jobTab==='all'||j.type===jobTab);const sums={};['target','applied','screened','interviewed','offers','joined'].forEach(k=>sums[k]=jobs.reduce((n,j)=>n+j[k],0));$('#hiringTarget').textContent=`入职 ${sums.joined} / 目标 ${sums.target} 人`;$('#jobTotal').textContent=`${jobs.length} 个示例项目`;const stages=[['applied','简历投递'],['screened','通过筛选'],['interviewed','进入面试'],['offers','发放 Offer'],['joined','已入职']];$('#funnelGrid').innerHTML=stages.map(([k,label],i)=>`<div class="funnel-stage"><p class="stage-label">${label}${i<4?icon('arrow'):icon('check')}</p><p class="value">${sums[k].toLocaleString()}<small>人</small></p><progress max="${sums.applied}" value="${sums[k]}" aria-label="${label} ${sums[k]}人"></progress><p>${i===0?'累计投递人数':'上阶段转化率 '+Math.round(sums[k]/sums[stages[i-1][0]]*100)+'%'}</p></div>`).join('');$('#jobTable').innerHTML=jobs.map(j=>`<tr><td><strong>${j.title}</strong><small>${j.cn}</small></td><td>${j.location}</td><td class="mono">${j.target} 人</td><td class="mono">${j.joined} 人</td><td><progress max="${j.target}" value="${j.joined}" aria-label="目标完成率 ${Math.round(j.joined/j.target*100)}%"></progress><span class="mono">${Math.round(j.joined/j.target*100)}%</span></td><td><span class="tag ${j.joined/j.target>=.7?'tag-green':'tag-blue'}">${j.joined/j.target>=.7?'持续交付':'推进中'}</span></td><td><button class="btn-text" data-job="${j.id}" aria-label="查看${j.cn}交付详情">查看 ${icon('arrow')}</button></td></tr>`).join('');$('#tableTotal').innerHTML=`<span>交付口径：已入职人数 / 招聘目标人数</span><span>整体完成率 ${Math.round(sums.joined/sums.target*100)}%</span>`;}
function jobDetail(id){const j=JOBS.find(x=>x.id===Number(id));openDrawer('Delivery details · 交付详情',`<h2 id="drawerTitle">${j.title}</h2><p class="drawer-sub">${j.cn}</p><span class="tag tag-amber">演示数据</span><div class="drawer-section"><h3>Project overview</h3><dl class="detail-grid"><dt>业务方向</dt><dd>${j.team}</dd><dt>招聘地区</dt><dd>${j.location}</dd><dt>负责团队</dt><dd>${j.owner}</dd><dt>目标人数</dt><dd>${j.target} 人</dd><dt>已入职</dt><dd>${j.joined} 人</dd><dt>尚待交付</dt><dd>${Math.max(0,j.target-j.joined)} 人</dd></dl></div><div class="drawer-section"><h3>Pipeline breakdown</h3><dl class="detail-grid">${[['applied','简历投递'],['screened','通过筛选'],['interviewed','进入面试'],['offers','发放 Offer'],['joined','已入职']].map(([k,l])=>`<dt>${l}</dt><dd>${j[k]} 人</dd>`).join('')}</dl></div><p class="source-note">以上为示例累计阶段数据，Offer 与入职人数不是互斥分类，不应相加作为候选人总数。</p><div class="drawer-button-row"><a href="#/directory" class="btn">查找院校渠道 ${icon('arrow')}</a></div>`);}
function poster(a){return `<img class="asset-preview" src="${a.preview}" width="${a.width}" height="${a.height}" loading="lazy" alt="${esc(a.cn)}预览">`;}
function creativePage(){assetTab='all';$('#main').innerHTML=heading('Creative Studio','创意运营 · 好内容，让每一次校园沟通更有力量。')+`<div class="asset-toolbar"><div class="tabs" aria-label="物料类型"><button data-asset-tab="all" class="active">全部物料 <small>${ASSETS.length}</small></button>${['品牌主视觉','延展物料','周边设计','实习生运营','节日海报'].map(t=>`<button data-asset-tab="${t}">${t}</button>`).join('')}</div><span class="muted" id="assetCount">${ASSETS.length} 份物料</span></div><div class="asset-grid" id="assetGrid"></div>`+footer();document.querySelectorAll('[data-asset-tab]').forEach(b=>b.addEventListener('click',()=>{assetTab=b.dataset.assetTab;document.querySelectorAll('[data-asset-tab]').forEach(x=>x.classList.toggle('active',x===b));renderAssets();}));renderAssets();}
function renderAssets(){const list=ASSETS.filter(a=>assetTab==='all'||a.type===assetTab);$('#assetCount').textContent=list.length+' 份物料';$('#assetGrid').innerHTML=list.map(a=>`<article class="asset-card">${poster(a)}<div class="asset-info"><div class="asset-info-head"><h3>${a.title}</h3><span class="tag tag-green">${a.status}</span></div><p>${a.cn} · ${a.type}</p><div class="asset-footer"><span>${a.format} · ${a.size}</span><button class="btn-text" data-asset="${a.id}">预览物料 ${icon('arrow')}</button></div></div></article>`).join('');}
function assetDetail(id){const a=ASSETS.find(x=>x.id===Number(id));openDrawer('Creative asset · 物料详情',`<h2 id="drawerTitle">${a.title}</h2><p class="drawer-sub">${a.cn}</p><span class="tag tag-green">${a.status}</span><div class="drawer-poster">${poster(a)}</div><dl class="detail-grid"><dt>物料类型</dt><dd>${a.type}</dd><dt>文件格式</dt><dd>${a.format}</dd><dt>画布尺寸</dt><dd>${a.size}</dd><dt>收录日期</dt><dd>${a.date}</dd><dt>当前状态</dt><dd>${a.status}</dd></dl><div class="drawer-section"><h3>Usage · 使用说明</h3><p>${a.usage}</p></div><div class="drawer-button-row"><a class="btn btn-primary" href="${a.href}" download="${esc(a.original)}">${icon('download')}下载原图</a></div><p class="source-note">来源：本项目创意运营物料包。</p>`);}
document.addEventListener('click',e=>{const school=e.target.closest('[data-school]');if(school)schoolDetail(school.dataset.school);const copy=e.target.closest('[data-copy]');if(copy)copyText(copy.dataset.copy);const ev=e.target.closest('[data-event]');if(ev)eventDetail(ev.dataset.event);const job=e.target.closest('[data-job]');if(job)jobDetail(job.dataset.job);const asset=e.target.closest('[data-asset]');if(asset)assetDetail(asset.dataset.asset);});
document.addEventListener('click',e=>{const b=e.target.closest('.tabs button');if(b)document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
function renderPage(){page=pageFromHash();route=routes.find(r=>r[0]===page)||routes[0];document.body.dataset.page=page;document.title=route[2]+' · 校园渠道项目网站';$('#nav').innerHTML=routes.map(r=>`<a href="${r[1]}" ${page===r[0]?'class="active" aria-current="page"':''}><span>${r[3]}</span></a>`).join('');$('#crumb').textContent=route[3];if($('#detailDrawer').open)$('#detailDrawer').close();if(page==='directory')directoryPage();else if(page==='events')eventsPage();else if(page==='recruitment')recruitmentPage();else if(page==='creative')creativePage();else homePage();document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.classList.contains('active'))));}
window.addEventListener('hashchange',()=>{renderPage();window.scrollTo({top:0,behavior:'auto'});});
if(!location.hash)history.replaceState(null,'','#/home');
renderPage();
