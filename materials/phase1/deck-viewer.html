<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Online Slides · 在线幻灯片</title>
<style>
:root{--blue:#0090f7;--green:#9cf833;--ink:#eef6ff;--muted:#9fb1c6;--panel:#122033;--line:#2b3b50}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}button,a{font:inherit}.shell{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.toolbar{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#0d1929;border-bottom:1px solid var(--line)}.back,.tool{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 13px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:transparent;text-decoration:none;cursor:pointer}.back:hover,.tool:hover{border-color:var(--blue);background:#102942}.title{min-width:0;flex:1}.title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}.title small{display:block;color:var(--muted);margin-top:2px}.stage{min-height:0;display:grid;place-items:center;padding:18px;position:relative}.slide{display:block;max-width:100%;max-height:calc(100dvh - 178px);width:auto;height:auto;object-fit:contain;background:#fff;box-shadow:0 18px 55px #0008}.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:72px;border:1px solid var(--line);border-radius:10px;background:#0d1929d9;color:#fff;font-size:27px;cursor:pointer}.nav:hover{background:#12385a;border-color:var(--blue)}.nav:disabled{opacity:.25;cursor:default}.prev{left:18px}.next{right:18px}.bottom{background:#0d1929;border-top:1px solid var(--line);padding:10px 14px}.progress{height:3px;background:#25364b;margin-bottom:10px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0}.thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-color:#435870 transparent;padding-bottom:3px}.thumb{flex:0 0 106px;padding:3px;border:2px solid transparent;border-radius:7px;background:#17263a;cursor:pointer}.thumb.active{border-color:var(--green)}.thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#fff}.thumb span{display:block;color:var(--muted);font-size:10px;padding:4px 2px 1px;text-align:center}.empty{padding:40px;text-align:center}.empty h1{font-size:24px}.empty p{color:var(--muted)}@media(max-width:700px){.toolbar{padding:9px 10px}.back{padding:7px 10px}.tool{display:none}.stage{padding:8px}.slide{max-height:calc(100dvh - 164px)}.nav{width:40px;height:60px;background:#0d192999}.prev{left:7px}.next{right:7px}.thumb{flex-basis:82px}}
</style>
</head>
<body>
<main class="shell" id="app" hidden>
  <header class="toolbar">
    <a class="back" href="../../index.html#/events" aria-label="返回活动页面">← 返回</a>
    <div class="title"><strong id="deckTitle"></strong><small id="counter"></small></div>
    <button class="tool" id="fullscreen" type="button">全屏查看</button>
  </header>
  <section class="stage" id="stage" aria-live="polite">
    <button class="nav prev" id="prev" type="button" aria-label="上一页">‹</button>
    <img class="slide" id="slide" alt="">
    <button class="nav next" id="next" type="button" aria-label="下一页">›</button>
  </section>
  <footer class="bottom"><div class="progress"><span id="progress"></span></div><div class="thumbs" id="thumbs"></div></footer>
</main>
<section class="empty" id="empty" hidden><h1>未找到幻灯片</h1><p>请返回活动页面重新打开。</p><a class="back" href="../../index.html#/events">返回活动页面</a></section>
<script>
const decks={
  'campus-recruitment-intro':{title:'校招团队宣讲PPT',count:6},
  'host-deck':{title:'第一期主持PPT',count:10},
  'live-course':{title:'简历 × 面试 × 校招大揭秘 · 第一期直播课',count:27}
};
const id=decodeURIComponent(location.hash.slice(1));
const deck=decks[id];
const $=s=>document.querySelector(s);
if(!deck){$('#empty').hidden=false}else{
  $('#app').hidden=false;document.title=deck.title+' · 在线幻灯片';$('#deckTitle').textContent=deck.title;
  let current=1,startX=0;
  const path=n=>`decks/${id}/slide-${n}.jpg`;
  $('#thumbs').innerHTML=Array.from({length:deck.count},(_,i)=>`<button class="thumb" type="button" data-page="${i+1}" aria-label="查看第 ${i+1} 页"><img src="${path(i+1)}" alt="" loading="lazy"><span>${i+1}</span></button>`).join('');
  function show(n){current=Math.max(1,Math.min(deck.count,n));$('#slide').src=path(current);$('#slide').alt=`${deck.title}，第 ${current} 页`;$('#counter').textContent=`第 ${current} / ${deck.count} 页`;$('#progress').style.width=`${current/deck.count*100}%`;$('#prev').disabled=current===1;$('#next').disabled=current===deck.count;document.querySelectorAll('.thumb').forEach(b=>b.classList.toggle('active',Number(b.dataset.page)===current));document.querySelector(`.thumb[data-page="${current}"]`)?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});if(current<deck.count){const preload=new Image;preload.src=path(current+1)}}
  $('#prev').onclick=()=>show(current-1);$('#next').onclick=()=>show(current+1);$('#thumbs').onclick=e=>{const b=e.target.closest('.thumb');if(b)show(Number(b.dataset.page))};
  document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(1);if(e.key==='End')show(deck.count)});
  $('#stage').addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});$('#stage').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>45)show(current+(d<0?1:-1))},{passive:true});
  $('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();show(1);
}
</script>

</html>
